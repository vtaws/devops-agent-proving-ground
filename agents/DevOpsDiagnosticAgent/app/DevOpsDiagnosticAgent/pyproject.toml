[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "DevOpsDiagnosticAgent"
version = "0.1.0"
description = "DevOps Diagnostic Agent — inspects broken AWS infrastructure and diagnoses root causes using real API calls"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] >= 0.2.0, < 1.0.0",
    "aws-opentelemetry-distro",
    "bedrock-agentcore[a2a] >= 1.9.1",
    "boto3>=1.35.0",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
